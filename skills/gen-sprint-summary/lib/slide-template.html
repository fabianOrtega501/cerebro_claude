<!doctype html>
<!--
  Maqueta del slide del sprint. `render-slide.mjs` sustituye los marcadores {{...}}.
  Se edita aqui el diseno; el JS solo arma el contenido.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
	@page { size: 1920px 1080px; margin: 0; }

	:root {
		--ink: #1f2937;
		--muted: #4b5563;
		--title: #2f5fd0;
		--scale: {{SCALE}};
	}

	* { box-sizing: border-box; margin: 0; padding: 0; }

	body {
		width: 1920px;
		height: 1080px;
		overflow: hidden;
		background: #fff;
		color: var(--ink);
		font-family: "Segoe UI", "Noto Sans", "DejaVu Sans", Arial, sans-serif;
		position: relative;
	}

	/* Logo de la esquina superior derecha, el de la plantilla del equipo. */
	.corner-logo { position: absolute; top: 34px; right: 60px; height: 130px; }

	.page { position: relative; padding: 46px 60px 40px; height: 100%; display: flex; flex-direction: column; gap: 22px; }

	h1 { font-size: 76px; font-weight: 800; color: var(--title); letter-spacing: -1px; line-height: 1; }
	.subtitle { font-size: 38px; font-weight: 700; color: var(--muted); margin-top: -8px; }

	/* Cada seccion ocupa lo que pide su contenido: una seccion de una sola caja estirada hasta
	   media diapositiva se lee como un hueco, no como diseno. */
	.sections { display: flex; flex-direction: column; gap: 20px; flex: 1; min-height: 0; justify-content: flex-start; }

	.section {
		border: 2px solid var(--accent);
		border-radius: 16px;
		padding: 14px 18px 18px;
		display: flex;
		flex-direction: column;
		gap: 12px;
		flex: 0 1 auto;
		min-height: 0;
	}

	.section-name { font-size: 30px; font-weight: 700; color: var(--accent); }

	.cards { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 14px; min-height: 0; }

	.card {
		border: 2px solid var(--accent);
		border-radius: 14px;
		padding: 14px 16px;
		display: flex;
		flex-direction: column;
		gap: calc(7px * var(--scale));
		overflow: hidden;
	}

	.line { font-size: calc(21px * var(--scale)); line-height: 1.34; color: var(--muted); }
	.line b { color: var(--ink); font-weight: 700; }
	.icon { margin-right: 6px; }
	.item-title { font-size: calc(23px * var(--scale)); font-weight: 700; color: var(--accent); line-height: 1.25; }
	.ticket { font-size: calc(18px * var(--scale)); font-weight: 700; color: var(--accent); }
</style>
</head>
<body>
	<img class="corner-logo" src="{{LOGO}}" alt="">

	<div class="page">
		<h1>{{AUTHOR}}</h1>{{SUBTITLE}}
		<div class="sections">{{SECTIONS}}</div>
	</div>
</body>
</html>
