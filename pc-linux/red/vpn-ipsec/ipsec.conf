# ipsec.conf - conexion VPN de la empresa (strongSwan, IKEv1 con PSK + XAuth)
# Reemplazar <usuario-vpn> y <ip-gateway-vpn> por los datos que entrega TI.

config setup

conn fabrica
    keyexchange=ikev1
    aggressive=yes
    right=<ip-gateway-vpn>
    rightauth=psk
    rightauth2=xauth
    leftauth=psk
    leftauth2=xauth
    leftid=<usuario-vpn>
    leftsourceip=%config
    rightsubnet=0.0.0.0/0
    xauth_identity=<usuario-vpn>
    # Fase 1: AES con SHA2/SHA1 y grupos DH 14 (modp2048) y 5 (modp1536)
    ike=aes256-sha256-modp2048,aes128-sha256-modp2048,aes256-sha1-modp1536,aes128-sha1-modp1536!
    # Fase 2 (ESP) con PFS en los mismos grupos
    esp=aes256-sha256-modp2048,aes128-sha256-modp2048,aes256-sha1-modp1536,aes128-sha1-modp1536!
    auto=add
    forceencaps=yes
    dpdaction=restart
    dpddelay=30s
    closeaction=clear
